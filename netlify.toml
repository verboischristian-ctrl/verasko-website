[build]
  publish = "site"
  # Skip the build (and its Netlify credits) when only docs or the README changed.
  # When Netlify has no previous commit to compare with (it then gives the same commit twice), always build.
  ignore = '[ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- site/ netlify.toml'

# verasko.ai and the www addresses all lead to verasko.com
[[redirects]]
  from = "https://verasko.ai/*"
  to = "https://verasko.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.verasko.ai/*"
  to = "https://verasko.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.verasko.com/*"
  to = "https://verasko.com/:splat"
  status = 301
  force = true

# Pages missing under /fr/ get the French 404 page. Existing files are served first.
[[redirects]]
  from = "/fr/*"
  to = "/fr/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    # Netlify already sends every http:// visit to https://. This tells browsers to never try http:// again.
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
